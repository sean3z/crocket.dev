        <header><span>cpp</span></header>
        <pre><code><span class="a">[[= http::get(</span><span class="s">"/teapot"</span><span class="a">)]]</span>
<span class="k">auto</span> teapot() -&gt; WithStatus&lt;418, Response&gt; {
  Response rs;
  rs.set_content_type(<span class="s">"text/html; charset=utf-8"</span>);
  rs.headers.set(<span class="s">"content-security-policy"</span>, kCsp);
  rs.headers.set(<span class="s">"cache-control"</span>, <span class="s">"no-cache"</span>);
  rs.body.assign(page, <span class="k">sizeof</span> page);
