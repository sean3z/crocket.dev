# crocket.dev on Ubuntu 24.04. nginx terminates TLS and proxies to the
# crocket container on 127.0.0.1:8100.
#
# Port 80 for both names redirects to the apex. www.crocket.dev on 443
# redirects there too. The certificate at
# /etc/letsencrypt/live/crocket.dev/ needs crocket.dev and www.crocket.dev
# on its SAN list, or the www handshake fails before the 301.

server {
    listen 80;
    listen [::]:80;
    server_name crocket.dev www.crocket.dev;
    return 301 https://crocket.dev$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.crocket.dev;

    ssl_certificate     /etc/letsencrypt/live/crocket.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crocket.dev/privkey.pem;

    return 301 https://crocket.dev$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name crocket.dev;

    ssl_certificate     /etc/letsencrypt/live/crocket.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crocket.dev/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:crocket_ssl:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    gzip on;
    gzip_types text/css application/javascript text/javascript image/svg+xml application/json;
    gzip_min_length 256;

    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }
}
